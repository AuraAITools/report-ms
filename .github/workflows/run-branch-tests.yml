# run testing on feature branch
# run testing on PRs to main trunk on the merge commit
name: branch test
run-name: running tests on branch ${{ github.ref_name }}
on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
    types:
      - "opened"
      - "edited"
      - "synchronize"
    branches:
      - "main"
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Install zed CLI
        run: |
          # _gnu = glibc build (vs _musl); matches ubuntu-22.04 runner
          ZED_VERSION="1.1.1"
          curl -sL "https://github.com/authzed/zed/releases/download/v${ZED_VERSION}/zed_${ZED_VERSION}_linux_amd64_gnu.tar.gz" -o zed.tar.gz
          tar -xzf zed.tar.gz
          sudo mv zed /usr/local/bin/zed
          rm zed.tar.gz
          zed version

      - name: Validate SpiceDB schema tests
        run: zed validate application/src/main/resources/spicedb/tests/*.test.yaml

      - name: Run tests
        run: mvn test
      - name: Test mvn build
        run: mvn -B package -DskipTests
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Test docker container build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
