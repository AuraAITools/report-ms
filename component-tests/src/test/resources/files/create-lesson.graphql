mutation CreateLessonInCourse($input: CreateLessonInCourseInput!) {
    createLessonInCourse(createLessonInCourse: $input) {
        id
        name
        lessonStartTimestamptz
        lessonEndTimestamptz
        description
        createdBy { userId accountId name url }
        updatedBy { userId accountId name url }
    }
}
