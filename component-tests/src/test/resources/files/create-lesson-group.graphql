mutation CreateLessonGroupInLesson($input: CreateLessonGroupInLessonInput!) {
    createLessonGroupInLesson(input: $input) {
        id
        name
        lesson { id }
        lessonGroupPlan {
            id
            plan
            state
        }
        lessonStudents { student { id } }
        createdAt
        createdBy { userId accountId name url }
    }
}
