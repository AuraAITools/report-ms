query GetCourseById($courseId: ID!) {
    getCourseById(courseId: $courseId) {
        id
        name
        maxSize
        lessonFrequency
        courseStartTimestamptz
        courseEndTimestamptz
        createdBy { userId accountId name url }
        updatedBy { userId accountId name url }
        lessons {
            id
            name
        }
        educators {
            id
        }
        students {
            id
        }
        subjects {
            id
            name
        }
        level {
            id
            name
        }
    }
}
