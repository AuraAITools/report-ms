query GetStudentById($input: GetStudentByIdInput!) {
    getStudentById(input: $input) {
        id
        name
        email
        dateOfBirth
        createdBy { userId accountId name url }
        updatedBy { userId accountId name url }
        createdAt
        updatedAt
        level {
            id
            name
        }
        school {
            id
            name
        }
        courses {
            id
            name
        }
    }
}
