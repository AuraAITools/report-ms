query GetLessonsByStudentId($institutionId: ID!, $studentId: ID!) {
    getLessonsByStudentId(institutionId: $institutionId, studentId: $studentId) {
        id
        name
        lessonStartTimestamptz
        lessonEndTimestamptz
        createdBy { userId accountId name url }
        updatedBy { userId accountId name url }
        course {
            id
        }
    }
}
