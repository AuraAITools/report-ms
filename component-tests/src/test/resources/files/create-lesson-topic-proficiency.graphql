mutation CreateLessonTopicProficiency($input: CreateLessonTopicProficiencyInput!) {
    createLessonTopicProficiency(input: $input) {
        id
        studentLessonReportId
        topicId
        rating
        createdAt
        createdBy { userId accountId name url }
        updatedAt
        updatedBy { userId accountId name url }
    }
}
