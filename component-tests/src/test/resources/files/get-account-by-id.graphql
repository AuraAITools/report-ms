query GetAccountById($accountId: ID!) {
    getAccountById(accountId: $accountId) {
        id
        firstName
        lastName
        userId
        createdBy { userId accountId name url }
        updatedBy { userId accountId name url }
        students {
            id
        }
        parent {
            id
            relationship
        }
        educators {
            id
        }
    }
}
