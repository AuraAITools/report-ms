mutation CreateLessonPlanInLesson($input: CreateLessonPlanInLessonInput!) {
    createLessonPlanInLesson(input: $input) {
        id
        plan
        createdAt
        createdBy { userId accountId name url }
        updatedAt
        updatedBy { userId accountId name url }
        lesson { id name }
        topics { id name }
    }
}
