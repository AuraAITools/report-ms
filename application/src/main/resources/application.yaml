server:
  port: 8080
  max-http-request-header-size=: 16KB
spring:
  liquibase:
    enabled: false
  application:
    name: report-service
  profiles:
    active:
      - cloud
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        generate_statistics: true
    show-sql: true
  threads:
    virtual:
      enabled: true
  graphql:
    path: /graphql
    schema:
      locations:
        - classpath:graphql/
        - classpath:graphql/types/
        - classpath:graphql/operations/outlets/
        - classpath:graphql/operations/levels/
        - classpath:graphql/operations/courses/
        - classpath:graphql/operations/lessons/
        - classpath:graphql/operations/accounts/
        - classpath:graphql/operations/institutions/
        - classpath:graphql/operations/topics/
        - classpath:graphql/operations/subjects/
        - classpath:graphql/operations/permissions/
        - classpath:graphql/operations/lesson_group_plans/
        - classpath:graphql/operations/lesson_groups/
        - classpath:graphql/operations/materials/
        - classpath:graphql/operations/schools/
        - classpath:graphql/operations/educators/
        - classpath:graphql/operations/parents/
        - classpath:graphql/operations/students/
        - classpath:graphql/operations/outlet_rooms/
        - classpath:graphql/operations/lesson_objectives/
        - classpath:graphql/operations/lesson_quizzes/
        - classpath:graphql/operations/student_lesson_reports/
        - classpath:graphql/operations/lesson_homework_completions/
        - classpath:graphql/operations/lesson_participation_reviews/
        - classpath:graphql/operations/lesson_topic_proficiencies/
# actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      enabled: true
#    info:
#      env:
#        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  enabled: true
spicedb:
  target: ${SPICEDB_TARGET:localhost:50051}
  preshared-key: ${SPICEDB_PRESHARED_KEY:}
  plaintext: ${SPICEDB_PLAINTEXT:true}
aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}
aura:
  email:
    enabled: ${AURA_EMAIL_ENABLED:true}
    from-address: ${AURA_EMAIL_FROM_ADDRESS:no-reply@aura.com}
    from-display-name: ${AURA_EMAIL_FROM_DISPLAY_NAME:Aura}
    base-url-app: ${AURA_EMAIL_BASE_URL_APP:https://app.aura.com}
    retry-delay-millis: ${AURA_EMAIL_RETRY_DELAY_MILLIS:5000}
    action-token-lifespan-seconds: ${AURA_EMAIL_ACTION_TOKEN_LIFESPAN_SECONDS:86400}
    action-redirect-uri: ${AURA_EMAIL_ACTION_REDIRECT_URI:https://app.aura.com/auth/complete}
    weekly-digest:
      enabled: ${AURA_EMAIL_WEEKLY_DIGEST_ENABLED:false}
      cron: ${AURA_EMAIL_WEEKLY_DIGEST_CRON:0 0 9 * * MON}
      zone: ${AURA_EMAIL_WEEKLY_DIGEST_ZONE:Asia/Singapore}
info:
  app:
    name: report-service
    description: report microservice
    version: 1.0.0