server:
  port: 8080
  max-http-request-header-size=: 16KB
spring:
  liquibase:
    enabled: false
  application:
    name: report-service
  profiles:
    active:
      - cloud
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        generate_statistics: true
    show-sql: true
  threads:
    virtual:
      enabled: true
  graphql:
    http:
      path: /tenant/graphql
    schema:
      locations:
        - classpath:graphql-tenant/
        - classpath:graphql-tenant/types/
        - classpath:graphql-tenant/operations/outlets/
        - classpath:graphql-tenant/operations/levels/
        - classpath:graphql-tenant/operations/courses/
        - classpath:graphql-tenant/operations/lessons/
        - classpath:graphql-tenant/operations/accounts/
        - classpath:graphql-tenant/operations/institutions/
        - classpath:graphql-tenant/operations/topics/
        - classpath:graphql-tenant/operations/subjects/
# actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      enabled: true
#    info:
#      env:
#        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  enabled: true
info:
  app:
    name: report-service
    description: report microservice
    version: 1.0.0