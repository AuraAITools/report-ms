<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weekly progress</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;padding:32px;max-width:90%;">
                <tr>
                    <td style="padding-bottom:24px;border-bottom:1px solid #ececec;">
                        <span style="font-size:20px;font-weight:600;color:#1d1d1f;">Aura</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 0;font-size:15px;line-height:1.55;color:#1d1d1f;">
                        <p style="margin:0 0 16px 0;font-size:18px;font-weight:600;">
                            Hi <span th:text="${parentFirstName}">there</span>,
                        </p>
                        <p style="margin:0 0 16px 0;">
                            Here's a snapshot of your child's week at
                            <strong th:text="${institutionName}">your institution</strong>
                            (<span th:text="${weekLabel}">this week</span>).
                        </p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="margin:16px 0;border-collapse:collapse;">
                            <tr th:each="student : ${students}"
                                style="border-bottom:1px solid #ececec;">
                                <td style="padding:12px 0;font-weight:600;width:35%;"
                                    th:text="${student.name}">
                                    Student name
                                </td>
                                <td style="padding:12px 0;color:#1d1d1f;">
                                    <span th:text="${student.lessonsCompleted}">0</span> lessons completed
                                    <br>
                                    <span style="color:#86868b;font-size:13px;"
                                          th:text="${student.highlight}">Highlight</span>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:16px 0 0 0;color:#86868b;font-size:13px;">
                            Open the Aura mobile app for the full report.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top:24px;border-top:1px solid #ececec;font-size:12px;color:#86868b;line-height:1.55;">
                        You're receiving this weekly summary because you have an Aura parent account.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
