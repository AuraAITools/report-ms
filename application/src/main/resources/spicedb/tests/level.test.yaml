schemaFile: ../level.zed

# Full coverage: direct level roles, inherited institution roles, transitively-inherited
# system roles, and negative cases.
#
# DIRECT (level_user_group:1):
#   lvl_group_admin_user   — group_admin
#   lvl_group_viewer_user  — group_viewer
#   lvl_admin_user         — admin     (view + update + delete)
#   lvl_modifier_user      — modifier  (view + update; NOT delete)
#   lvl_viewer_user        — viewer    (view only)
#
# INHERITED (institution_user_group:1, reaches level via level#parent):
#   inst_group_admin_user  — group_admin (institution) — NO inherited level access
#   inst_group_viewer_user — group_viewer (institution) — NO inherited level access
#   inst_admin_user        — admin (institution)        — inherits view + update + delete
#   inst_modifier_user     — modifier (institution)     — inherits view + update; NOT delete
#   inst_viewer_user       — viewer (institution)       — inherits view only
#
# TRANSITIVELY INHERITED resource roles (system_user_group:aura, reaches level via level#parent -> institution#parent):
#   sys_admin_user         — admin (system)         — inherits view + update + delete
#   sys_modifier_user      — modifier (system)      — inherits view + update; NOT delete
#   sys_viewer_user        — viewer (system)        — inherits view only
#
# SUPERADMIN cascade (each *_user_group#parent -> system_user_group):
#   sys_group_admin_user   — group_admin (system)   — superadmin: full group-mgmt on level_user_group AND institution_user_group
#   sys_group_viewer_user  — group_viewer (system)  — group_view only on each descendant *_user_group
#
# Negative:
#   non_member_user — no relationships
relationships: |-
  level_user_group:1#group_admin@user:lvl_group_admin_user
  level_user_group:1#group_viewer@user:lvl_group_viewer_user
  level_user_group:1#admin@user:lvl_admin_user
  level_user_group:1#modifier@user:lvl_modifier_user
  level_user_group:1#viewer@user:lvl_viewer_user
  level:1#user_group@level_user_group:1

  institution_user_group:1#group_admin@user:inst_group_admin_user
  institution_user_group:1#group_viewer@user:inst_group_viewer_user
  institution_user_group:1#admin@user:inst_admin_user
  institution_user_group:1#modifier@user:inst_modifier_user
  institution_user_group:1#viewer@user:inst_viewer_user
  institution:1#user_group@institution_user_group:1

  system_user_group:aura#group_admin@user:sys_group_admin_user
  system_user_group:aura#group_viewer@user:sys_group_viewer_user
  system_user_group:aura#admin@user:sys_admin_user
  system_user_group:aura#modifier@user:sys_modifier_user
  system_user_group:aura#viewer@user:sys_viewer_user
  system:aura#user_group@system_user_group:aura

  level:1#parent@institution:1
  institution:1#parent@system:aura

  level_user_group:1#parent@system_user_group:aura
  institution_user_group:1#parent@system_user_group:aura

assertions:
  assertTrue:
    # ============================================================
    # DIRECT level roles
    # ============================================================

    # ---- lvl_group_admin_user — full group-management ----
    - level_user_group:1#group_view@user:lvl_group_admin_user
    - level_user_group:1#group_add_admin@user:lvl_group_admin_user
    - level_user_group:1#group_add_viewer@user:lvl_group_admin_user
    - level_user_group:1#group_remove_admin@user:lvl_group_admin_user
    - level_user_group:1#group_remove_viewer@user:lvl_group_admin_user

    # ---- lvl_group_viewer_user — only group_view ----
    - level_user_group:1#group_view@user:lvl_group_viewer_user

    # ---- lvl_admin_user — view + update + delete ----
    - level_user_group:1#view@user:lvl_admin_user
    - level_user_group:1#update@user:lvl_admin_user
    - level_user_group:1#delete@user:lvl_admin_user
    - level:1#view@user:lvl_admin_user
    - level:1#update@user:lvl_admin_user
    - level:1#delete@user:lvl_admin_user
    - level:1#is_admin_or_modifier@user:lvl_admin_user

    # ---- lvl_modifier_user — view + update; NOT delete ----
    - level_user_group:1#view@user:lvl_modifier_user
    - level_user_group:1#update@user:lvl_modifier_user
    - level:1#view@user:lvl_modifier_user
    - level:1#update@user:lvl_modifier_user
    - level:1#is_admin_or_modifier@user:lvl_modifier_user

    # ---- lvl_viewer_user — view only ----
    - level_user_group:1#view@user:lvl_viewer_user
    - level:1#view@user:lvl_viewer_user

    # ============================================================
    # INHERITED roles via level#parent -> institution
    # ============================================================

    # ---- inst_admin_user — inherits view + update + delete ----
    - level:1#view@user:inst_admin_user
    - level:1#update@user:inst_admin_user
    - level:1#delete@user:inst_admin_user

    # ---- inst_modifier_user — inherits view + update; NOT delete ----
    - level:1#view@user:inst_modifier_user
    - level:1#update@user:inst_modifier_user

    # ---- inst_viewer_user — inherits view only ----
    - level:1#view@user:inst_viewer_user

    # ============================================================
    # TRANSITIVELY INHERITED roles via level -> institution -> system
    # ============================================================

    # ---- sys_admin_user — transitively inherits view + update + delete ----
    - level:1#view@user:sys_admin_user
    - level:1#update@user:sys_admin_user
    - level:1#delete@user:sys_admin_user

    # ---- sys_modifier_user — transitively inherits view + update; NOT delete ----
    - level:1#view@user:sys_modifier_user
    - level:1#update@user:sys_modifier_user

    # ---- sys_viewer_user — transitively inherits view only ----
    - level:1#view@user:sys_viewer_user

    # ============================================================
    # SUPERADMIN cascade via level_user_group#parent -> system_user_group
    # ============================================================

    # ---- sys_group_admin_user — full group-management on level_user_group ----
    - level_user_group:1#group_view@user:sys_group_admin_user
    - level_user_group:1#group_add_admin@user:sys_group_admin_user
    - level_user_group:1#group_add_viewer@user:sys_group_admin_user
    - level_user_group:1#group_remove_admin@user:sys_group_admin_user
    - level_user_group:1#group_remove_viewer@user:sys_group_admin_user

    # ---- sys_group_viewer_user — only group_view on level_user_group ----
    - level_user_group:1#group_view@user:sys_group_viewer_user

  assertFalse:
    # ============================================================
    # non_member_user (no relationships anywhere)
    # ============================================================
    - level_user_group:1#group_view@user:non_member_user
    - level_user_group:1#view@user:non_member_user
    - level_user_group:1#update@user:non_member_user
    - level_user_group:1#delete@user:non_member_user
    - level:1#view@user:non_member_user
    - level:1#update@user:non_member_user
    - level:1#delete@user:non_member_user

    # ============================================================
    # DIRECT level role exclusions
    # ============================================================

    # ---- lvl_group_admin_user — NO resource access ----
    - level_user_group:1#view@user:lvl_group_admin_user
    - level_user_group:1#update@user:lvl_group_admin_user
    - level_user_group:1#delete@user:lvl_group_admin_user
    - level:1#view@user:lvl_group_admin_user
    - level:1#update@user:lvl_group_admin_user
    - level:1#delete@user:lvl_group_admin_user

    # ---- lvl_group_viewer_user — only group_view, no resource access ----
    - level_user_group:1#group_add_admin@user:lvl_group_viewer_user
    - level_user_group:1#view@user:lvl_group_viewer_user
    - level:1#view@user:lvl_group_viewer_user

    # ---- lvl_admin_user — NO group-management ----
    - level_user_group:1#group_view@user:lvl_admin_user
    - level_user_group:1#group_add_admin@user:lvl_admin_user

    # ---- lvl_modifier_user — no delete, no group-mgmt ----
    - level_user_group:1#delete@user:lvl_modifier_user
    - level:1#delete@user:lvl_modifier_user
    - level_user_group:1#group_view@user:lvl_modifier_user

    # ---- lvl_viewer_user — no update/delete, no group-mgmt ----
    - level_user_group:1#update@user:lvl_viewer_user
    - level_user_group:1#delete@user:lvl_viewer_user
    - level:1#update@user:lvl_viewer_user
    - level:1#delete@user:lvl_viewer_user
    - level_user_group:1#group_view@user:lvl_viewer_user

    # ============================================================
    # INHERITED (institution) role exclusions
    # ============================================================

    # ---- inst_group_admin_user — group mgmt at institution confers NO level access ----
    - level:1#view@user:inst_group_admin_user
    - level:1#update@user:inst_group_admin_user
    - level:1#delete@user:inst_group_admin_user

    # ---- inst_group_viewer_user — same: no inherited level access ----
    - level:1#view@user:inst_group_viewer_user

    # ---- inst_modifier_user — cannot delete level ----
    - level:1#delete@user:inst_modifier_user

    # ---- inst_viewer_user — cannot update/delete level ----
    - level:1#update@user:inst_viewer_user
    - level:1#delete@user:inst_viewer_user

    # ---- Inherited institution users do NOT gain permissions on level_user_group ----
    - level_user_group:1#view@user:inst_admin_user
    - level_user_group:1#group_view@user:inst_admin_user

    # ============================================================
    # TRANSITIVELY INHERITED (system) role exclusions
    # ============================================================

    # ---- sys_modifier_user — cannot delete level ----
    - level:1#delete@user:sys_modifier_user

    # ---- sys_viewer_user — cannot update/delete level ----
    - level:1#update@user:sys_viewer_user
    - level:1#delete@user:sys_viewer_user

    # ---- Transitively-inherited system users do NOT gain perms on level_user_group ----
    - level_user_group:1#view@user:sys_admin_user
    - level_user_group:1#group_view@user:sys_admin_user

    # ---- sys_group_admin_user / sys_group_viewer_user — group-mgmt at system confers NO level resource access (decoupling) ----
    - level:1#view@user:sys_group_admin_user
    - level:1#update@user:sys_group_admin_user
    - level:1#delete@user:sys_group_admin_user
    - level:1#view@user:sys_group_viewer_user

    # ---- sys_group_viewer_user — only group_view; no group mutations on level_user_group ----
    - level_user_group:1#group_add_admin@user:sys_group_viewer_user
    - level_user_group:1#group_add_viewer@user:sys_group_viewer_user

    # ---- sys_modifier / sys_viewer — resource roles do NOT confer group-mgmt on level_user_group ----
    - level_user_group:1#group_view@user:sys_modifier_user
    - level_user_group:1#group_view@user:sys_viewer_user
