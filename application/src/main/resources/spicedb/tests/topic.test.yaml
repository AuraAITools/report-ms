schemaFile: ../topic.zed

# Full coverage: direct topic roles, inherited institution roles, transitively-inherited
# system roles, and negative cases.
#
# DIRECT (topic_user_group:1):
#   top_group_admin_user   — group_admin
#   top_group_viewer_user  — group_viewer
#   top_admin_user         — admin     (view + update + delete)
#   top_modifier_user      — modifier  (view + update; NOT delete)
#   top_viewer_user        — viewer    (view only)
#
# INHERITED (institution_user_group:1, reaches topic via topic#parent):
#   inst_group_admin_user  — group_admin (institution) — NO inherited topic access
#   inst_group_viewer_user — group_viewer (institution) — NO inherited topic access
#   inst_admin_user        — admin (institution)        — inherits view + update + delete
#   inst_modifier_user     — modifier (institution)     — inherits view + update; NOT delete
#   inst_viewer_user       — viewer (institution)       — inherits view only
#
# TRANSITIVELY INHERITED resource roles (system_user_group:aura, reaches topic via topic#parent -> institution#parent):
#   sys_admin_user         — admin (system)         — inherits view + update + delete
#   sys_modifier_user      — modifier (system)      — inherits view + update; NOT delete
#   sys_viewer_user        — viewer (system)        — inherits view only
#
# SUPERADMIN cascade (each *_user_group#parent -> system_user_group):
#   sys_group_admin_user   — group_admin (system)   — superadmin: full group-mgmt on topic_user_group AND institution_user_group
#   sys_group_viewer_user  — group_viewer (system)  — group_view only on each descendant *_user_group
#
# Negative:
#   non_member_user — no relationships
relationships: |-
  topic_user_group:1#group_admin@user:top_group_admin_user
  topic_user_group:1#group_viewer@user:top_group_viewer_user
  topic_user_group:1#admin@user:top_admin_user
  topic_user_group:1#modifier@user:top_modifier_user
  topic_user_group:1#viewer@user:top_viewer_user
  topic:1#user_group@topic_user_group:1

  institution_user_group:1#group_admin@user:inst_group_admin_user
  institution_user_group:1#group_viewer@user:inst_group_viewer_user
  institution_user_group:1#admin@user:inst_admin_user
  institution_user_group:1#modifier@user:inst_modifier_user
  institution_user_group:1#viewer@user:inst_viewer_user
  institution:1#user_group@institution_user_group:1

  system_user_group:aura#group_admin@user:sys_group_admin_user
  system_user_group:aura#group_viewer@user:sys_group_viewer_user
  system_user_group:aura#admin@user:sys_admin_user
  system_user_group:aura#modifier@user:sys_modifier_user
  system_user_group:aura#viewer@user:sys_viewer_user
  system:aura#user_group@system_user_group:aura

  topic:1#parent@institution:1
  institution:1#parent@system:aura

  topic_user_group:1#parent@system_user_group:aura
  institution_user_group:1#parent@system_user_group:aura

assertions:
  assertTrue:
    # ============================================================
    # DIRECT topic roles
    # ============================================================

    # ---- top_group_admin_user — full group-management ----
    - topic_user_group:1#group_view@user:top_group_admin_user
    - topic_user_group:1#group_add_admin@user:top_group_admin_user
    - topic_user_group:1#group_add_viewer@user:top_group_admin_user
    - topic_user_group:1#group_remove_admin@user:top_group_admin_user
    - topic_user_group:1#group_remove_viewer@user:top_group_admin_user

    # ---- top_group_viewer_user — only group_view ----
    - topic_user_group:1#group_view@user:top_group_viewer_user

    # ---- top_admin_user — view + update + delete ----
    - topic_user_group:1#view@user:top_admin_user
    - topic_user_group:1#update@user:top_admin_user
    - topic_user_group:1#delete@user:top_admin_user
    - topic:1#view@user:top_admin_user
    - topic:1#update@user:top_admin_user
    - topic:1#delete@user:top_admin_user
    - topic:1#is_admin_or_modifier@user:top_admin_user

    # ---- top_modifier_user — view + update; NOT delete ----
    - topic_user_group:1#view@user:top_modifier_user
    - topic_user_group:1#update@user:top_modifier_user
    - topic:1#view@user:top_modifier_user
    - topic:1#update@user:top_modifier_user
    - topic:1#is_admin_or_modifier@user:top_modifier_user

    # ---- top_viewer_user — view only ----
    - topic_user_group:1#view@user:top_viewer_user
    - topic:1#view@user:top_viewer_user

    # ============================================================
    # INHERITED roles via topic#parent -> institution
    # ============================================================

    # ---- inst_admin_user — inherits view + update + delete ----
    - topic:1#view@user:inst_admin_user
    - topic:1#update@user:inst_admin_user
    - topic:1#delete@user:inst_admin_user

    # ---- inst_modifier_user — inherits view + update; NOT delete ----
    - topic:1#view@user:inst_modifier_user
    - topic:1#update@user:inst_modifier_user

    # ---- inst_viewer_user — inherits view only ----
    - topic:1#view@user:inst_viewer_user

    # ============================================================
    # TRANSITIVELY INHERITED roles via topic -> institution -> system
    # ============================================================

    # ---- sys_admin_user — transitively inherits view + update + delete ----
    - topic:1#view@user:sys_admin_user
    - topic:1#update@user:sys_admin_user
    - topic:1#delete@user:sys_admin_user

    # ---- sys_modifier_user — transitively inherits view + update; NOT delete ----
    - topic:1#view@user:sys_modifier_user
    - topic:1#update@user:sys_modifier_user

    # ---- sys_viewer_user — transitively inherits view only ----
    - topic:1#view@user:sys_viewer_user

    # ============================================================
    # SUPERADMIN cascade via topic_user_group#parent -> system_user_group
    # ============================================================

    # ---- sys_group_admin_user — full group-management on topic_user_group ----
    - topic_user_group:1#group_view@user:sys_group_admin_user
    - topic_user_group:1#group_add_admin@user:sys_group_admin_user
    - topic_user_group:1#group_add_viewer@user:sys_group_admin_user
    - topic_user_group:1#group_remove_admin@user:sys_group_admin_user
    - topic_user_group:1#group_remove_viewer@user:sys_group_admin_user

    # ---- sys_group_viewer_user — only group_view on topic_user_group ----
    - topic_user_group:1#group_view@user:sys_group_viewer_user

  assertFalse:
    # ============================================================
    # non_member_user (no relationships anywhere)
    # ============================================================
    - topic_user_group:1#group_view@user:non_member_user
    - topic_user_group:1#view@user:non_member_user
    - topic_user_group:1#update@user:non_member_user
    - topic_user_group:1#delete@user:non_member_user
    - topic:1#view@user:non_member_user
    - topic:1#update@user:non_member_user
    - topic:1#delete@user:non_member_user

    # ============================================================
    # DIRECT topic role exclusions
    # ============================================================

    # ---- top_group_admin_user — NO resource access ----
    - topic_user_group:1#view@user:top_group_admin_user
    - topic_user_group:1#update@user:top_group_admin_user
    - topic_user_group:1#delete@user:top_group_admin_user
    - topic:1#view@user:top_group_admin_user
    - topic:1#update@user:top_group_admin_user
    - topic:1#delete@user:top_group_admin_user

    # ---- top_group_viewer_user — only group_view, no resource access ----
    - topic_user_group:1#group_add_admin@user:top_group_viewer_user
    - topic_user_group:1#view@user:top_group_viewer_user
    - topic:1#view@user:top_group_viewer_user

    # ---- top_admin_user — NO group-management ----
    - topic_user_group:1#group_view@user:top_admin_user
    - topic_user_group:1#group_add_admin@user:top_admin_user

    # ---- top_modifier_user — no delete, no group-mgmt ----
    - topic_user_group:1#delete@user:top_modifier_user
    - topic:1#delete@user:top_modifier_user
    - topic_user_group:1#group_view@user:top_modifier_user

    # ---- top_viewer_user — no update/delete, no group-mgmt ----
    - topic_user_group:1#update@user:top_viewer_user
    - topic_user_group:1#delete@user:top_viewer_user
    - topic:1#update@user:top_viewer_user
    - topic:1#delete@user:top_viewer_user
    - topic_user_group:1#group_view@user:top_viewer_user

    # ============================================================
    # INHERITED (institution) role exclusions
    # ============================================================

    # ---- inst_group_admin_user — group mgmt at institution confers NO topic access ----
    - topic:1#view@user:inst_group_admin_user
    - topic:1#update@user:inst_group_admin_user
    - topic:1#delete@user:inst_group_admin_user

    # ---- inst_group_viewer_user — same: no inherited topic access ----
    - topic:1#view@user:inst_group_viewer_user

    # ---- inst_modifier_user — cannot delete topic ----
    - topic:1#delete@user:inst_modifier_user

    # ---- inst_viewer_user — cannot update/delete topic ----
    - topic:1#update@user:inst_viewer_user
    - topic:1#delete@user:inst_viewer_user

    # ---- Inherited institution users do NOT gain permissions on topic_user_group ----
    - topic_user_group:1#view@user:inst_admin_user
    - topic_user_group:1#group_view@user:inst_admin_user

    # ============================================================
    # TRANSITIVELY INHERITED (system) role exclusions
    # ============================================================

    # ---- sys_modifier_user — cannot delete topic ----
    - topic:1#delete@user:sys_modifier_user

    # ---- sys_viewer_user — cannot update/delete topic ----
    - topic:1#update@user:sys_viewer_user
    - topic:1#delete@user:sys_viewer_user

    # ---- Transitively-inherited system users do NOT gain perms on topic_user_group ----
    - topic_user_group:1#view@user:sys_admin_user
    - topic_user_group:1#group_view@user:sys_admin_user

    # ---- sys_group_admin_user / sys_group_viewer_user — group-mgmt at system confers NO topic resource access (decoupling) ----
    - topic:1#view@user:sys_group_admin_user
    - topic:1#update@user:sys_group_admin_user
    - topic:1#delete@user:sys_group_admin_user
    - topic:1#view@user:sys_group_viewer_user

    # ---- sys_group_viewer_user — only group_view; no group mutations on topic_user_group ----
    - topic_user_group:1#group_add_admin@user:sys_group_viewer_user
    - topic_user_group:1#group_add_viewer@user:sys_group_viewer_user

    # ---- sys_modifier / sys_viewer — resource roles do NOT confer group-mgmt on topic_user_group ----
    - topic_user_group:1#group_view@user:sys_modifier_user
    - topic_user_group:1#group_view@user:sys_viewer_user
