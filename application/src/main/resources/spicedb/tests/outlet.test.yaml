    - outlet_user_group:1#group_remove_group_viewer@user:sys_admin_user
    - outlet_user_group:1#group_view@user:sys_modifier_user
    - outlet_user_group:1#group_add_modifier@user:sys_modifier_user
    - outlet_user_group:1#group_remove_modifier@user:sys_modifier_user
    - outlet_user_group:1#group_add_group_admin@user:sys_modifier_user
    - outlet_user_group:1#group_remove_group_admin@user:sys_modifier_user
    - outlet_user_group:1#group_add_group_viewer@user:sys_modifier_user
    - outlet_user_group:1#group_remove_group_viewer@user:sys_modifier_user
    - outlet_user_group:1#group_view@user:sys_viewer_user
    - outlet_user_group:1#group_add_modifier@user:sys_viewer_user
    - outlet_user_group:1#group_remove_modifier@user:sys_viewer_user
    - outlet_user_group:1#group_add_group_admin@user:sys_viewer_user
    - outlet_user_group:1#group_remove_group_admin@user:sys_viewer_user
    - outlet_user_group:1#group_add_group_viewer@user:sys_viewer_user
    - outlet_user_group:1#group_remove_group_viewer@user:sys_viewer_user

    # ---- sys_modifier_user — cannot delete outlet (system modifier lacks delete) ----
    - outlet:1#delete@user:sys_modifier_user

    # ---- sys_viewer_user — cannot update or delete outlet ----
    - outlet:1#update@user:sys_viewer_user
    - outlet:1#delete@user:sys_viewer_user

    # ---- Transitively-inherited system users do NOT gain perms on outlet_user_group ----
    - outlet_user_group:1#view@user:sys_admin_user
    - outlet_user_group:1#update@user:sys_admin_user
    - outlet_user_group:1#delete@user:sys_admin_user
    - outlet_user_group:1#group_view@user:sys_admin_user
