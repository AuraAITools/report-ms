    # ---- sys_admin / sys_modifier / sys_viewer — resource roles do NOT confer group-mgmt on outlet_user_group (decoupling) ----
    - outlet_user_group:1#group_view@user:sys_admin_user
    - outlet_user_group:1#group_add_admin@user:sys_admin_user
