schemaFile: ../subject.zed

# Full coverage: direct subject roles, inherited institution roles, transitively-inherited
# system roles, and negative cases.
#
# DIRECT (subject_user_group:1):
#   sub_group_admin_user   — group_admin
#   sub_group_viewer_user  — group_viewer
#   sub_admin_user         — admin     (view + update + delete)
#   sub_modifier_user      — modifier  (view + update; NOT delete)
#   sub_viewer_user        — viewer    (view only)
#
# INHERITED (institution_user_group:1, reaches subject via subject#parent):
#   inst_group_admin_user  — group_admin (institution) — NO inherited subject access
#   inst_group_viewer_user — group_viewer (institution) — NO inherited subject access
#   inst_admin_user        — admin (institution)        — inherits view + update + delete
#   inst_modifier_user     — modifier (institution)     — inherits view + update; NOT delete
#   inst_viewer_user       — viewer (institution)       — inherits view only
#
# TRANSITIVELY INHERITED resource roles (system_user_group:aura, reaches subject via subject#parent -> institution#parent):
#   sys_admin_user         — admin (system)         — inherits view + update + delete
#   sys_modifier_user      — modifier (system)      — inherits view + update; NOT delete
#   sys_viewer_user        — viewer (system)        — inherits view only
#
# SUPERADMIN cascade (each *_user_group#parent -> system_user_group):
#   sys_group_admin_user   — group_admin (system)   — superadmin: full group-mgmt on subject_user_group AND institution_user_group
#   sys_group_viewer_user  — group_viewer (system)  — group_view only on each descendant *_user_group
#
# Negative:
#   non_member_user — no relationships
relationships: |-
  subject_user_group:1#group_admin@user:sub_group_admin_user
  subject_user_group:1#group_viewer@user:sub_group_viewer_user
  subject_user_group:1#admin@user:sub_admin_user
  subject_user_group:1#modifier@user:sub_modifier_user
  subject_user_group:1#viewer@user:sub_viewer_user
  subject:1#user_group@subject_user_group:1

  institution_user_group:1#group_admin@user:inst_group_admin_user
  institution_user_group:1#group_viewer@user:inst_group_viewer_user
  institution_user_group:1#admin@user:inst_admin_user
  institution_user_group:1#modifier@user:inst_modifier_user
  institution_user_group:1#viewer@user:inst_viewer_user
  institution:1#user_group@institution_user_group:1

  system_user_group:aura#group_admin@user:sys_group_admin_user
  system_user_group:aura#group_viewer@user:sys_group_viewer_user
  system_user_group:aura#admin@user:sys_admin_user
  system_user_group:aura#modifier@user:sys_modifier_user
  system_user_group:aura#viewer@user:sys_viewer_user
  system:aura#user_group@system_user_group:aura

  subject:1#parent@institution:1
  institution:1#parent@system:aura

  subject_user_group:1#parent@system_user_group:aura
  institution_user_group:1#parent@system_user_group:aura

assertions:
  assertTrue:
    # ============================================================
    # DIRECT subject roles
    # ============================================================

    # ---- sub_group_admin_user — full group-management ----
    - subject_user_group:1#group_view@user:sub_group_admin_user
    - subject_user_group:1#group_add_admin@user:sub_group_admin_user
    - subject_user_group:1#group_add_viewer@user:sub_group_admin_user
    - subject_user_group:1#group_remove_admin@user:sub_group_admin_user
    - subject_user_group:1#group_remove_viewer@user:sub_group_admin_user

    # ---- sub_group_viewer_user — only group_view ----
    - subject_user_group:1#group_view@user:sub_group_viewer_user

    # ---- sub_admin_user — view + update + delete ----
    - subject_user_group:1#view@user:sub_admin_user
    - subject_user_group:1#update@user:sub_admin_user
    - subject_user_group:1#delete@user:sub_admin_user
    - subject:1#view@user:sub_admin_user
    - subject:1#update@user:sub_admin_user
    - subject:1#delete@user:sub_admin_user
    - subject:1#is_admin_or_modifier@user:sub_admin_user

    # ---- sub_modifier_user — view + update; NOT delete ----
    - subject_user_group:1#view@user:sub_modifier_user
    - subject_user_group:1#update@user:sub_modifier_user
    - subject:1#view@user:sub_modifier_user
    - subject:1#update@user:sub_modifier_user
    - subject:1#is_admin_or_modifier@user:sub_modifier_user

    # ---- sub_viewer_user — view only ----
    - subject_user_group:1#view@user:sub_viewer_user
    - subject:1#view@user:sub_viewer_user

    # ============================================================
    # INHERITED roles via subject#parent -> institution
    # ============================================================

    # ---- inst_admin_user — inherits view + update + delete ----
    - subject:1#view@user:inst_admin_user
    - subject:1#update@user:inst_admin_user
    - subject:1#delete@user:inst_admin_user

    # ---- inst_modifier_user — inherits view + update; NOT delete ----
    - subject:1#view@user:inst_modifier_user
    - subject:1#update@user:inst_modifier_user

    # ---- inst_viewer_user — inherits view only ----
    - subject:1#view@user:inst_viewer_user

    # ============================================================
    # TRANSITIVELY INHERITED roles via subject -> institution -> system
    # ============================================================

    # ---- sys_admin_user — transitively inherits view + update + delete ----
    - subject:1#view@user:sys_admin_user
    - subject:1#update@user:sys_admin_user
    - subject:1#delete@user:sys_admin_user

    # ---- sys_modifier_user — transitively inherits view + update; NOT delete ----
    - subject:1#view@user:sys_modifier_user
    - subject:1#update@user:sys_modifier_user

    # ---- sys_viewer_user — transitively inherits view only ----
    - subject:1#view@user:sys_viewer_user

    # ============================================================
    # SUPERADMIN cascade via subject_user_group#parent -> system_user_group
    # ============================================================

    # ---- sys_group_admin_user — full group-management on subject_user_group ----
    - subject_user_group:1#group_view@user:sys_group_admin_user
    - subject_user_group:1#group_add_admin@user:sys_group_admin_user
    - subject_user_group:1#group_add_viewer@user:sys_group_admin_user
    - subject_user_group:1#group_remove_admin@user:sys_group_admin_user
    - subject_user_group:1#group_remove_viewer@user:sys_group_admin_user

    # ---- sys_group_viewer_user — only group_view on subject_user_group ----
    - subject_user_group:1#group_view@user:sys_group_viewer_user

  assertFalse:
    # ============================================================
    # non_member_user (no relationships anywhere)
    # ============================================================
    - subject_user_group:1#group_view@user:non_member_user
    - subject_user_group:1#view@user:non_member_user
    - subject_user_group:1#update@user:non_member_user
    - subject_user_group:1#delete@user:non_member_user
    - subject:1#view@user:non_member_user
    - subject:1#update@user:non_member_user
    - subject:1#delete@user:non_member_user

    # ============================================================
    # DIRECT subject role exclusions
    # ============================================================

    # ---- sub_group_admin_user — NO resource access ----
    - subject_user_group:1#view@user:sub_group_admin_user
    - subject_user_group:1#update@user:sub_group_admin_user
    - subject_user_group:1#delete@user:sub_group_admin_user
    - subject:1#view@user:sub_group_admin_user
    - subject:1#update@user:sub_group_admin_user
    - subject:1#delete@user:sub_group_admin_user

    # ---- sub_group_viewer_user — only group_view, no resource access ----
    - subject_user_group:1#group_add_admin@user:sub_group_viewer_user
    - subject_user_group:1#view@user:sub_group_viewer_user
    - subject:1#view@user:sub_group_viewer_user

    # ---- sub_admin_user — NO group-management ----
    - subject_user_group:1#group_view@user:sub_admin_user
    - subject_user_group:1#group_add_admin@user:sub_admin_user

    # ---- sub_modifier_user — no delete, no group-mgmt ----
    - subject_user_group:1#delete@user:sub_modifier_user
    - subject:1#delete@user:sub_modifier_user
    - subject_user_group:1#group_view@user:sub_modifier_user

    # ---- sub_viewer_user — no update/delete, no group-mgmt ----
    - subject_user_group:1#update@user:sub_viewer_user
    - subject_user_group:1#delete@user:sub_viewer_user
    - subject:1#update@user:sub_viewer_user
    - subject:1#delete@user:sub_viewer_user
    - subject_user_group:1#group_view@user:sub_viewer_user

    # ============================================================
    # INHERITED (institution) role exclusions
    # ============================================================

    # ---- inst_group_admin_user — group mgmt at institution confers NO subject access ----
    - subject:1#view@user:inst_group_admin_user
    - subject:1#update@user:inst_group_admin_user
    - subject:1#delete@user:inst_group_admin_user

    # ---- inst_group_viewer_user — same: no inherited subject access ----
    - subject:1#view@user:inst_group_viewer_user

    # ---- inst_modifier_user — cannot delete subject ----
    - subject:1#delete@user:inst_modifier_user

    # ---- inst_viewer_user — cannot update/delete subject ----
    - subject:1#update@user:inst_viewer_user
    - subject:1#delete@user:inst_viewer_user

    # ---- Inherited institution users do NOT gain permissions on subject_user_group ----
    - subject_user_group:1#view@user:inst_admin_user
    - subject_user_group:1#group_view@user:inst_admin_user

    # ============================================================
    # TRANSITIVELY INHERITED (system) role exclusions
    # ============================================================

    # ---- sys_modifier_user — cannot delete subject ----
    - subject:1#delete@user:sys_modifier_user

    # ---- sys_viewer_user — cannot update/delete subject ----
    - subject:1#update@user:sys_viewer_user
    - subject:1#delete@user:sys_viewer_user

    # ---- Transitively-inherited system users do NOT gain perms on subject_user_group ----
    - subject_user_group:1#view@user:sys_admin_user
    - subject_user_group:1#group_view@user:sys_admin_user

    # ---- sys_group_admin_user / sys_group_viewer_user — group-mgmt at system confers NO subject resource access (decoupling) ----
    - subject:1#view@user:sys_group_admin_user
    - subject:1#update@user:sys_group_admin_user
    - subject:1#delete@user:sys_group_admin_user
    - subject:1#view@user:sys_group_viewer_user

    # ---- sys_group_viewer_user — only group_view; no group mutations on subject_user_group ----
    - subject_user_group:1#group_add_admin@user:sys_group_viewer_user
    - subject_user_group:1#group_add_viewer@user:sys_group_viewer_user

    # ---- sys_modifier / sys_viewer — resource roles do NOT confer group-mgmt on subject_user_group ----
    - subject_user_group:1#group_view@user:sys_modifier_user
    - subject_user_group:1#group_view@user:sys_viewer_user
