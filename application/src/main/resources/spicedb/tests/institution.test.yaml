schemaFile: ../institution.zed

# Full coverage: direct institution roles, inherited system roles (recursive via
# is_admin_or_modifier), and negative cases.
#
# DIRECT (institution_user_group:1):
#   inst_group_admin_user   — group_admin
#   inst_group_viewer_user  — group_viewer
#   inst_admin_user         — admin     (view + update + delete; is_admin_or_modifier; create_outlet)
#   inst_modifier_user      — modifier  (view + update; is_admin_or_modifier; create_outlet; NOT delete)
#   inst_viewer_user        — viewer    (view only)
#
# INHERITED (system_user_group:aura):
#   sys_group_admin_user    — group_admin (system) — superadmin: cascades into institution_user_group group-mgmt
#   sys_group_viewer_user   — group_viewer (system) — cascades into institution_user_group group_view only
#   sys_admin_user          — admin (system) — inherits resource: view + update + delete + is_admin_or_modifier + create_outlet via institution#parent
#   sys_modifier_user       — modifier (system) — inherits view + update + is_admin_or_modifier + create_outlet; NOT delete
#   sys_viewer_user         — viewer (system) — inherits view only
#
# Negative:
#   non_member_user — no relationships
relationships: |-
  institution_user_group:1#group_admin@user:inst_group_admin_user
  institution_user_group:1#group_viewer@user:inst_group_viewer_user
  institution_user_group:1#admin@user:inst_admin_user
  institution_user_group:1#modifier@user:inst_modifier_user
  institution_user_group:1#viewer@user:inst_viewer_user
  institution:1#user_group@institution_user_group:1

  system_user_group:aura#group_admin@user:sys_group_admin_user
  system_user_group:aura#group_viewer@user:sys_group_viewer_user
  system_user_group:aura#admin@user:sys_admin_user
  system_user_group:aura#modifier@user:sys_modifier_user
  system_user_group:aura#viewer@user:sys_viewer_user
  system:aura#user_group@system_user_group:aura

  institution:1#parent@system:aura
  institution_user_group:1#parent@system_user_group:aura

assertions:
  assertTrue:
