    - institution_user_group:1#group_add_admin@user:inst_group_admin_user
    - institution_user_group:1#group_add_viewer@user:inst_group_admin_user
    - institution_user_group:1#group_remove_admin@user:inst_group_admin_user
    - institution_user_group:1#group_remove_viewer@user:inst_group_admin_user
    - institution_user_group:1#group_add_modifier@user:inst_group_admin_user
    - institution_user_group:1#group_remove_modifier@user:inst_group_admin_user
    - institution_user_group:1#group_add_group_admin@user:inst_group_admin_user
    - institution_user_group:1#group_remove_group_admin@user:inst_group_admin_user
    - institution_user_group:1#group_add_group_viewer@user:inst_group_admin_user
    - institution_user_group:1#group_remove_group_viewer@user:inst_group_admin_user

    # ---- inst_group_viewer_user — only group_view ----
    - institution_user_group:1#group_view@user:inst_group_viewer_user

    # ---- inst_admin_user — view/update/delete/is_admin_or_modifier on user_group; all resource perms on institution ----
