    - course_user_group:1#group_remove_group_viewer@user:sys_admin_user

    # ---- sys_modifier / sys_viewer resource roles — NO group-mgmt on course_user_group ----
    - course_user_group:1#group_add_modifier@user:sys_modifier_user
    - course_user_group:1#group_remove_modifier@user:sys_modifier_user
    - course_user_group:1#group_add_group_admin@user:sys_modifier_user
    - course_user_group:1#group_remove_group_admin@user:sys_modifier_user
    - course_user_group:1#group_add_group_viewer@user:sys_modifier_user
    - course_user_group:1#group_remove_group_viewer@user:sys_modifier_user
    - course_user_group:1#group_add_modifier@user:sys_viewer_user
    - course_user_group:1#group_remove_modifier@user:sys_viewer_user
    - course_user_group:1#group_add_group_admin@user:sys_viewer_user
    - course_user_group:1#group_remove_group_admin@user:sys_viewer_user
    - course_user_group:1#group_add_group_viewer@user:sys_viewer_user
    - course_user_group:1#group_remove_group_viewer@user:sys_viewer_user

    # ---- sys_group_admin_user / sys_group_viewer_user — group-mgmt at system confers NO course resource access (decoupling) ----
    - course:1#view@user:sys_group_admin_user
    - course:1#update@user:sys_group_admin_user
    - course:1#delete@user:sys_group_admin_user
    - course:1#create_lesson@user:sys_group_admin_user
    - course:1#view@user:sys_group_viewer_user
    - course:1#update@user:sys_group_viewer_user

    # ---- sys_group_viewer_user — only group_view; no group mutations on course_user_group ----
    - course_user_group:1#group_add_admin@user:sys_group_viewer_user
    - course_user_group:1#group_add_viewer@user:sys_group_viewer_user
    - course_user_group:1#group_remove_admin@user:sys_group_viewer_user
    - course_user_group:1#group_remove_viewer@user:sys_group_viewer_user
    - course_user_group:1#group_add_modifier@user:sys_group_viewer_user
    - course_user_group:1#group_remove_modifier@user:sys_group_viewer_user
    - course_user_group:1#group_add_group_admin@user:sys_group_viewer_user
    - course_user_group:1#group_remove_group_admin@user:sys_group_viewer_user
    - course_user_group:1#group_add_group_viewer@user:sys_group_viewer_user
    - course_user_group:1#group_remove_group_viewer@user:sys_group_viewer_user

    # ---- sys_modifier / sys_viewer — resource roles do NOT confer group-mgmt on course_user_group ----
