    - course_user_group:1#group_remove_modifier@user:non_member_user
    - course_user_group:1#group_add_group_admin@user:non_member_user
    - course_user_group:1#group_remove_group_admin@user:non_member_user
    - course_user_group:1#group_add_group_viewer@user:non_member_user
    - course_user_group:1#group_remove_group_viewer@user:non_member_user
    - course_user_group:1#view@user:non_member_user
    - course_user_group:1#update@user:non_member_user
    - course_user_group:1#delete@user:non_member_user
    - course:1#view@user:non_member_user
