schemaFile: ../account.zed

# Full coverage: direct account roles, inherited institution roles, transitively-inherited
# system roles, and negative cases.
#
# account_user_group#parent chains hierarchically:
#   account_user_group:1 -> institution_user_group:1 -> system_user_group:aura
# so group-management on the account_user_group cascades from both the institution and
# system user_groups.
#
# DIRECT (account_user_group:1):
#   acc_group_admin_user   — group_admin
#   acc_group_viewer_user  — group_viewer
#   acc_admin_user         — admin     (view + update + delete)
#   acc_modifier_user      — modifier  (view + update; NOT delete)
#   acc_viewer_user        — viewer    (view only)
#
# INHERITED (institution_user_group:1):
#   inst_group_admin_user  — group_admin (institution) — gains full group-mgmt on account_user_group; NO account resource access
#   inst_group_viewer_user — group_viewer (institution) — gains group_view on account_user_group; NO account resource access
#   inst_admin_user        — admin (institution)        — inherits view + update + delete; NO group-mgmt
#   inst_modifier_user     — modifier (institution)     — inherits view + update; NOT delete; NO group-mgmt
#   inst_viewer_user       — viewer (institution)       — inherits view only; NO group-mgmt
#
# TRANSITIVELY INHERITED (system_user_group:aura):
#   sys_admin_user         — admin (system)         — inherits view + update + delete
#   sys_modifier_user      — modifier (system)      — inherits view + update; NOT delete
#   sys_viewer_user        — viewer (system)        — inherits view only
#   sys_group_admin_user   — group_admin (system)   — superadmin: full group-mgmt on account_user_group (via chained parent)
#   sys_group_viewer_user  — group_viewer (system)  — group_view only on account_user_group
#
# Negative:
#   non_member_user — no relationships
relationships: |-
  account_user_group:1#group_admin@user:acc_group_admin_user
  account_user_group:1#group_viewer@user:acc_group_viewer_user
  account_user_group:1#admin@user:acc_admin_user
  account_user_group:1#modifier@user:acc_modifier_user
  account_user_group:1#viewer@user:acc_viewer_user
  account:1#user_group@account_user_group:1

  institution_user_group:1#group_admin@user:inst_group_admin_user
  institution_user_group:1#group_viewer@user:inst_group_viewer_user
  institution_user_group:1#admin@user:inst_admin_user
  institution_user_group:1#modifier@user:inst_modifier_user
  institution_user_group:1#viewer@user:inst_viewer_user
  institution:1#user_group@institution_user_group:1

  system_user_group:aura#group_admin@user:sys_group_admin_user
  system_user_group:aura#group_viewer@user:sys_group_viewer_user
  system_user_group:aura#admin@user:sys_admin_user
  system_user_group:aura#modifier@user:sys_modifier_user
  system_user_group:aura#viewer@user:sys_viewer_user
  system:aura#user_group@system_user_group:aura

  account:1#parent@institution:1
  institution:1#parent@system:aura

  account_user_group:1#parent@institution_user_group:1
  institution_user_group:1#parent@system_user_group:aura

assertions:
  assertTrue:
    # ============================================================
    # DIRECT account roles
    # ============================================================

    # ---- acc_group_admin_user — full group-management ----
    - account_user_group:1#group_view@user:acc_group_admin_user
    - account_user_group:1#group_add_admin@user:acc_group_admin_user
    - account_user_group:1#group_add_viewer@user:acc_group_admin_user
    - account_user_group:1#group_remove_admin@user:acc_group_admin_user
    - account_user_group:1#group_remove_viewer@user:acc_group_admin_user
    - account_user_group:1#group_add_modifier@user:acc_group_admin_user
    - account_user_group:1#group_remove_modifier@user:acc_group_admin_user
    - account_user_group:1#group_add_group_admin@user:acc_group_admin_user
    - account_user_group:1#group_remove_group_admin@user:acc_group_admin_user
    - account_user_group:1#group_add_group_viewer@user:acc_group_admin_user
    - account_user_group:1#group_remove_group_viewer@user:acc_group_admin_user

    # ---- acc_group_viewer_user — only group_view ----
    - account_user_group:1#group_view@user:acc_group_viewer_user

    # ---- acc_admin_user — view + update + delete on both definitions ----
    - account_user_group:1#view@user:acc_admin_user
    - account_user_group:1#update@user:acc_admin_user
    - account_user_group:1#delete@user:acc_admin_user
    - account_user_group:1#is_admin_or_modifier@user:acc_admin_user
    - account:1#view@user:acc_admin_user
    - account:1#update@user:acc_admin_user
    - account:1#delete@user:acc_admin_user
    - account:1#is_admin_or_modifier@user:acc_admin_user

    # ---- acc_modifier_user — view + update; NOT delete ----
    - account_user_group:1#view@user:acc_modifier_user
    - account_user_group:1#update@user:acc_modifier_user
    - account_user_group:1#is_admin_or_modifier@user:acc_modifier_user
    - account:1#view@user:acc_modifier_user
    - account:1#update@user:acc_modifier_user
    - account:1#is_admin_or_modifier@user:acc_modifier_user

    # ---- acc_viewer_user — view only ----
    - account_user_group:1#view@user:acc_viewer_user
    - account:1#view@user:acc_viewer_user

    # ============================================================
    # INHERITED roles via account#parent -> institution
    # ============================================================

    # ---- inst_admin_user — inherits view + update + delete ----
    - account:1#view@user:inst_admin_user
    - account:1#update@user:inst_admin_user
    - account:1#delete@user:inst_admin_user

    # ---- inst_modifier_user — inherits view + update; NOT delete ----
    - account:1#view@user:inst_modifier_user
    - account:1#update@user:inst_modifier_user

    # ---- inst_viewer_user — inherits view only ----
    - account:1#view@user:inst_viewer_user

    # ============================================================
    # INHERITED group-mgmt via account_user_group#parent -> institution_user_group
    # ============================================================

    # ---- inst_group_admin_user — full group-mgmt on account_user_group ----
    - account_user_group:1#group_view@user:inst_group_admin_user
    - account_user_group:1#group_add_admin@user:inst_group_admin_user
    - account_user_group:1#group_add_viewer@user:inst_group_admin_user
    - account_user_group:1#group_remove_admin@user:inst_group_admin_user
    - account_user_group:1#group_remove_viewer@user:inst_group_admin_user
    - account_user_group:1#group_add_modifier@user:inst_group_admin_user
    - account_user_group:1#group_remove_modifier@user:inst_group_admin_user
    - account_user_group:1#group_add_group_admin@user:inst_group_admin_user
    - account_user_group:1#group_remove_group_admin@user:inst_group_admin_user
    - account_user_group:1#group_add_group_viewer@user:inst_group_admin_user
    - account_user_group:1#group_remove_group_viewer@user:inst_group_admin_user

    # ---- inst_group_viewer_user — only group_view on account_user_group ----
    - account_user_group:1#group_view@user:inst_group_viewer_user

    # ============================================================
    # TRANSITIVELY INHERITED roles via account -> institution -> system
    # ============================================================

    # ---- sys_admin_user — transitively inherits view + update + delete ----
    - account:1#view@user:sys_admin_user
    - account:1#update@user:sys_admin_user
    - account:1#delete@user:sys_admin_user

    # ---- sys_modifier_user — transitively inherits view + update; NOT delete ----
    - account:1#view@user:sys_modifier_user
    - account:1#update@user:sys_modifier_user

    # ---- sys_viewer_user — transitively inherits view only ----
    - account:1#view@user:sys_viewer_user

    # ============================================================
    # TRANSITIVE SUPERADMIN cascade via account_user_group -> institution_user_group -> system_user_group
    # ============================================================

    # ---- sys_group_admin_user — full group-management on account_user_group ----
    - account_user_group:1#group_view@user:sys_group_admin_user
    - account_user_group:1#group_add_admin@user:sys_group_admin_user
    - account_user_group:1#group_add_viewer@user:sys_group_admin_user
    - account_user_group:1#group_remove_admin@user:sys_group_admin_user
    - account_user_group:1#group_remove_viewer@user:sys_group_admin_user
    - account_user_group:1#group_add_modifier@user:sys_group_admin_user
    - account_user_group:1#group_remove_modifier@user:sys_group_admin_user
    - account_user_group:1#group_add_group_admin@user:sys_group_admin_user
    - account_user_group:1#group_remove_group_admin@user:sys_group_admin_user
    - account_user_group:1#group_add_group_viewer@user:sys_group_admin_user
    - account_user_group:1#group_remove_group_viewer@user:sys_group_admin_user

    # ---- sys_group_viewer_user — only group_view on account_user_group ----
    - account_user_group:1#group_view@user:sys_group_viewer_user

  assertFalse:
    # ============================================================
    # non_member_user (no relationships anywhere)
    # ============================================================
    - account_user_group:1#group_view@user:non_member_user
    - account_user_group:1#group_add_modifier@user:non_member_user
    - account_user_group:1#group_remove_modifier@user:non_member_user
    - account_user_group:1#group_add_group_admin@user:non_member_user
    - account_user_group:1#group_remove_group_admin@user:non_member_user
    - account_user_group:1#group_add_group_viewer@user:non_member_user
    - account_user_group:1#group_remove_group_viewer@user:non_member_user
    - account_user_group:1#view@user:non_member_user
    - account_user_group:1#update@user:non_member_user
    - account_user_group:1#delete@user:non_member_user
    - account:1#view@user:non_member_user
    - account:1#update@user:non_member_user
    - account:1#delete@user:non_member_user

    # ============================================================
    # DIRECT account role exclusions
    # ============================================================

    # ---- acc_group_admin_user — NO resource access ----
    - account_user_group:1#view@user:acc_group_admin_user
    - account_user_group:1#update@user:acc_group_admin_user
    - account_user_group:1#delete@user:acc_group_admin_user
    - account:1#view@user:acc_group_admin_user
    - account:1#update@user:acc_group_admin_user
    - account:1#delete@user:acc_group_admin_user

    # ---- acc_group_viewer_user — only group_view, no resource access ----
    - account_user_group:1#group_add_admin@user:acc_group_viewer_user
    - account_user_group:1#group_add_viewer@user:acc_group_viewer_user
    - account_user_group:1#group_remove_admin@user:acc_group_viewer_user
    - account_user_group:1#group_remove_viewer@user:acc_group_viewer_user
    - account_user_group:1#group_add_modifier@user:acc_group_viewer_user
    - account_user_group:1#group_remove_modifier@user:acc_group_viewer_user
    - account_user_group:1#group_add_group_admin@user:acc_group_viewer_user
    - account_user_group:1#group_remove_group_admin@user:acc_group_viewer_user
    - account_user_group:1#group_add_group_viewer@user:acc_group_viewer_user
    - account_user_group:1#group_remove_group_viewer@user:acc_group_viewer_user
    - account_user_group:1#view@user:acc_group_viewer_user
    - account_user_group:1#update@user:acc_group_viewer_user
    - account_user_group:1#delete@user:acc_group_viewer_user
    - account:1#view@user:acc_group_viewer_user
    - account:1#update@user:acc_group_viewer_user
    - account:1#delete@user:acc_group_viewer_user

    # ---- acc_admin_user — NO group-management (decoupling) ----
    - account_user_group:1#group_view@user:acc_admin_user
    - account_user_group:1#group_add_admin@user:acc_admin_user
    - account_user_group:1#group_add_viewer@user:acc_admin_user
    - account_user_group:1#group_remove_admin@user:acc_admin_user
    - account_user_group:1#group_remove_viewer@user:acc_admin_user
    - account_user_group:1#group_add_modifier@user:acc_admin_user
    - account_user_group:1#group_remove_modifier@user:acc_admin_user
    - account_user_group:1#group_add_group_admin@user:acc_admin_user
    - account_user_group:1#group_remove_group_admin@user:acc_admin_user
    - account_user_group:1#group_add_group_viewer@user:acc_admin_user
    - account_user_group:1#group_remove_group_viewer@user:acc_admin_user

    # ---- acc_modifier_user — no delete, no group-mgmt ----
    - account_user_group:1#delete@user:acc_modifier_user
    - account:1#delete@user:acc_modifier_user
    - account_user_group:1#group_view@user:acc_modifier_user
    - account_user_group:1#group_add_admin@user:acc_modifier_user
    - account_user_group:1#group_add_modifier@user:acc_modifier_user
    - account_user_group:1#group_remove_modifier@user:acc_modifier_user
    - account_user_group:1#group_add_group_admin@user:acc_modifier_user
    - account_user_group:1#group_remove_group_admin@user:acc_modifier_user
    - account_user_group:1#group_add_group_viewer@user:acc_modifier_user
    - account_user_group:1#group_remove_group_viewer@user:acc_modifier_user

    # ---- acc_viewer_user — no update/delete, no group-mgmt ----
    - account_user_group:1#update@user:acc_viewer_user
    - account_user_group:1#delete@user:acc_viewer_user
    - account:1#update@user:acc_viewer_user
    - account:1#delete@user:acc_viewer_user
    - account_user_group:1#group_view@user:acc_viewer_user
    - account_user_group:1#group_add_admin@user:acc_viewer_user
    - account_user_group:1#group_add_modifier@user:acc_viewer_user
    - account_user_group:1#group_remove_modifier@user:acc_viewer_user
    - account_user_group:1#group_add_group_admin@user:acc_viewer_user
    - account_user_group:1#group_remove_group_admin@user:acc_viewer_user
    - account_user_group:1#group_add_group_viewer@user:acc_viewer_user
    - account_user_group:1#group_remove_group_viewer@user:acc_viewer_user

    # ============================================================
    # INHERITED (institution) role exclusions
    # ============================================================

    # ---- inst_group_admin_user — group-mgmt only; NO inherited account resource access (decoupling) ----
    - account:1#view@user:inst_group_admin_user
    - account:1#update@user:inst_group_admin_user
    - account:1#delete@user:inst_group_admin_user

    # ---- inst_group_viewer_user — group_view only; NO inherited account resource access; NO group mutations ----
    - account:1#view@user:inst_group_viewer_user
    - account:1#update@user:inst_group_viewer_user
    - account:1#delete@user:inst_group_viewer_user
    - account_user_group:1#group_add_admin@user:inst_group_viewer_user
    - account_user_group:1#group_add_modifier@user:inst_group_viewer_user
    - account_user_group:1#group_remove_modifier@user:inst_group_viewer_user
    - account_user_group:1#group_add_group_admin@user:inst_group_viewer_user
    - account_user_group:1#group_remove_group_admin@user:inst_group_viewer_user
    - account_user_group:1#group_add_group_viewer@user:inst_group_viewer_user
    - account_user_group:1#group_remove_group_viewer@user:inst_group_viewer_user

    # ---- inst_modifier_user — cannot delete account (institution modifier lacks delete) ----
    - account:1#delete@user:inst_modifier_user

    # ---- inst_viewer_user — cannot update or delete account ----
    - account:1#update@user:inst_viewer_user
    - account:1#delete@user:inst_viewer_user

    # ---- Inherited institution RESOURCE roles do NOT confer account_user_group group-mgmt (decoupling) ----
    - account_user_group:1#view@user:inst_admin_user
    - account_user_group:1#update@user:inst_admin_user
    - account_user_group:1#delete@user:inst_admin_user
    - account_user_group:1#group_view@user:inst_admin_user
    - account_user_group:1#group_add_admin@user:inst_admin_user

    # ============================================================
    # TRANSITIVELY INHERITED (system) role exclusions
    # ============================================================

    # ---- sys_group_admin_user — group mgmt at system confers NO account resource access (decoupling) ----
    - account:1#view@user:sys_group_admin_user
    - account:1#update@user:sys_group_admin_user
    - account:1#delete@user:sys_group_admin_user

    # ---- sys_group_viewer_user — same: no transitive account resource access; only group_view on account_user_group ----
    - account:1#view@user:sys_group_viewer_user
    - account:1#update@user:sys_group_viewer_user
    - account:1#delete@user:sys_group_viewer_user
    - account_user_group:1#group_add_admin@user:sys_group_viewer_user
    - account_user_group:1#group_add_viewer@user:sys_group_viewer_user
    - account_user_group:1#group_remove_admin@user:sys_group_viewer_user
    - account_user_group:1#group_remove_viewer@user:sys_group_viewer_user
    - account_user_group:1#group_add_modifier@user:sys_group_viewer_user
    - account_user_group:1#group_remove_modifier@user:sys_group_viewer_user
    - account_user_group:1#group_add_group_admin@user:sys_group_viewer_user
    - account_user_group:1#group_remove_group_admin@user:sys_group_viewer_user
    - account_user_group:1#group_add_group_viewer@user:sys_group_viewer_user
    - account_user_group:1#group_remove_group_viewer@user:sys_group_viewer_user

    # ---- sys_admin / sys_modifier / sys_viewer — resource roles do NOT confer group-mgmt on account_user_group (decoupling) ----
    - account_user_group:1#group_view@user:sys_admin_user
    - account_user_group:1#group_add_admin@user:sys_admin_user
    - account_user_group:1#group_add_modifier@user:sys_admin_user
    - account_user_group:1#group_remove_modifier@user:sys_admin_user
    - account_user_group:1#group_add_group_admin@user:sys_admin_user
    - account_user_group:1#group_remove_group_admin@user:sys_admin_user
    - account_user_group:1#group_add_group_viewer@user:sys_admin_user
    - account_user_group:1#group_remove_group_viewer@user:sys_admin_user
    - account_user_group:1#group_view@user:sys_modifier_user
    - account_user_group:1#group_add_modifier@user:sys_modifier_user
    - account_user_group:1#group_remove_modifier@user:sys_modifier_user
    - account_user_group:1#group_add_group_admin@user:sys_modifier_user
    - account_user_group:1#group_remove_group_admin@user:sys_modifier_user
    - account_user_group:1#group_add_group_viewer@user:sys_modifier_user
    - account_user_group:1#group_remove_group_viewer@user:sys_modifier_user
    - account_user_group:1#group_view@user:sys_viewer_user
    - account_user_group:1#group_add_modifier@user:sys_viewer_user
    - account_user_group:1#group_remove_modifier@user:sys_viewer_user
    - account_user_group:1#group_add_group_admin@user:sys_viewer_user
    - account_user_group:1#group_remove_group_admin@user:sys_viewer_user
    - account_user_group:1#group_add_group_viewer@user:sys_viewer_user
    - account_user_group:1#group_remove_group_viewer@user:sys_viewer_user

    # ---- sys_modifier_user — cannot delete account (system modifier lacks delete) ----
    - account:1#delete@user:sys_modifier_user

    # ---- sys_viewer_user — cannot update or delete account ----
    - account:1#update@user:sys_viewer_user
    - account:1#delete@user:sys_viewer_user

    # ---- Transitively-inherited system RESOURCE roles do NOT gain perms on account_user_group ----
    - account_user_group:1#view@user:sys_admin_user
    - account_user_group:1#update@user:sys_admin_user
    - account_user_group:1#delete@user:sys_admin_user
    - account_user_group:1#group_view@user:sys_admin_user
