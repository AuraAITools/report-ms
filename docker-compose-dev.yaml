services:
  postgres:
    image: postgres:18.0
    container_name: postgres-dev
    ports:
      - 5434:5432
    logging:
      driver: "json-file"
      options:
        max-file: "5" # max number of log files to rotate
        max-size: "15m" # max size of log files
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: postgres # TBC
      POSTGRES_PASSWORD: password #TBC
      PGDATA: /var/lib/postgresql/aura-data-dev
    volumes:
      - aura-pgdata-dev:/var/lib/postgresql/aura-data-dev

  localstack:
    image: localstack/localstack:3.8
    container_name: localstack-dev
    ports:
      - 4566:4566
    environment:
      SERVICES: s3
      DEBUG: 0
      AWS_DEFAULT_REGION: ap-southeast-1
      # creds the LocalStack S3 endpoint accepts — match these in the app env
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # allow browser PUTs from the local frontend (CORS preflight)
      EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    healthcheck:
      test: [ "CMD-SHELL", "awslocal s3 ls" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aura-localstack-dev:/var/lib/localstack
      # ran on container startup — bootstraps the dev bucket so the app finds it on first boot
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh

volumes:
  aura-pgdata-dev:
    name: aura-pgdata-dev
  aura-localstack-dev:
    name: aura-localstack-dev
